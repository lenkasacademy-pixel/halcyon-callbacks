.btns{display:flex;gap:8px;align-items:center}

a.call{background:var(--call)}
a.wa{background:var(--wa);width:44px;padding:0}
label.chk{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--muted);gap:2px;cursor:pointer}
label.chk input{width:20px;height:20px;accent-color:var(--call)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
@media (max-width:420px){a.call span{display:none}a.call{width:48px;padding:0}}

const KEY='halcyon_na_called';
let called={}; try{called=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(called))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=p=>p.slice(0,5)+' '+p.slice(5);
const waIcon='<svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.4 14.2c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>';
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase().replace(/\s/g,'');
  const f=document.getElementById('f').value;
  const list=document.getElementById('list'); let html='', lastDay='', shown=0;
  for(const l of LEADS){
    const done=!!called[l.phone];
    if(f==='todo'&&done) continue; if(f==='done'&&!done) continue;
    if(q && !(l.name.toLowerCase().replace(/\s/g,'').includes(q) || l.phone.includes(q))) continue;
    if(l.day!==lastDay){html+=`<div class="day">${esc(l.dayl)}</div>`; lastDay=l.day;}
    shown++;
    html+=`<div class="card${done?' done':''}">
      <div class="info"><div class="name">${esc(l.name)}${l.n>1?`<span class="tag">×${l.n}</span>`:''}</div>

      </div></div>`;
  }
  list.innerHTML = html || '<div class="empty">No leads match.</div>';
  const d=LEADS.filter(l=>called[l.phone]).length;
  document.getElementById('sTotal').textContent=`${LEADS.length} leads`;
  document.getElementById('sDone').textContent=`✅ ${d} called`;
  document.getElementById('sLeft').textContent=`⏳ ${LEADS.length-d} left`;
}
document.getElementById('list').addEventListener('click',e=>{
  const a=e.target.closest('a.call'); if(a){called[a.dataset.p]=Date.now(); save(); setTimeout(render,300);}
});
document.getElementById('list').addEventListener('change',e=>{
  if(e.target.matches('input[type=checkbox]')){const p=e.target.dataset.p; if(e.target.checked) called[p]=Date.now(); else delete called[p]; save(); render();}
});
document.getElementById('q').addEventListener('input',render);
document.getElementById('f').addEventListener('change',render);
render();
